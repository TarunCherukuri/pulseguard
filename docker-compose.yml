services:

  kafka:
    image: apache/kafka:4.3.1
    container_name: pulseguard-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3


  qdrant:
    image: qdrant/qdrant:latest
    container_name: pulseguard-qdrant

    ports:
      - "6333:6333"
      - "6334:6334"


  spark:
    image: apache/spark:4.0.4-scala2.13-java21-python3-ubuntu
    container_name: pulseguard-spark

    working_dir: /opt/pulseguard

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    volumes:
      - ./streaming:/opt/pulseguard/streaming
      - ./checkpoints:/opt/pulseguard/checkpoints
      - ./quarantine:/opt/pulseguard/quarantine

    ports:
      - "4040:4040"

    command:
      - bash
      - -c
      - sleep infinity